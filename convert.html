<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Конвертация | Мультимедиа Инструменты</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Главная</a>
        <a href="background.html">Удаление фона</a>
        <a href="audio.html">Вырезать звук</a>
        <a href="convert.html" class="active">Конвертер</a>
        <a href="eraser.html">Ретушь</a>
    </nav>

    <div class="container">
        <h2>Конвертация изображений</h2>
        <div class="controls">
            <div class="file-upload-wrapper">
                <label class="file-upload-button-area">
                    <input type="file" id="convertInput" accept="image/*">
                    <span class="file-upload-btn">Выберите файл</span>
                </label>
                <span class="file-name-display" id="convertName">Файл не выбран</span>
            </div>
            <select id="convertFormat">
                <option value="image/jpeg" selected>JPG / JPEG</option>
                <option value="image/png">PNG</option>
            </select>
            <button id="convertBtn">Конвертировать</button>
        </div>
        <div id="convertStatus" class="status"></div>
        <div id="convertResult" class="result-area"></div>
    </div>

    <script type="module" src="js/convert.js"></script>
</body>
</html>
