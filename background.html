<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Удаление фона | Мультимедиа Инструменты</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Главная</a>
        <a href="background.html" class="active">Удаление фона</a>
        <a href="audio.html">Вырезать звук</a>
        <a href="convert.html">Конвертер</a>
        <a href="eraser.html">Ретушь</a>
    </nav>

    <div class="container">
        <h2>Удаление фона</h2>
        <div class="controls">
            <div class="file-upload-wrapper">
                <label class="file-upload-button-area">
                    <input type="file" id="fileInput" accept="image/*">
                    <span class="file-upload-btn">Выберите файл</span>
                </label>
                <span class="file-name-display" id="fileName">Файл не выбран</span>
            </div>    
            <button id="removeBtn">Удалить фон</button>
        </div>
        <div id="status" class="status"></div>
        <div id="result" class="result-area"></div>
    </div>

    <!-- Важно: type="module" -->
    <script type="module" src="js/background.js"></script>
</body>
</html>
