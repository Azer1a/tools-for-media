<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Ретушь | Мультимедиа Инструменты</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Главная</a>
        <a href="background.html">Удаление фона</a>
        <a href="audio.html">Вырезать звук</a>
        <a href="convert.html">Конвертер</a>
        <a href="eraser.html" class="active">Ретушь</a>
    </nav>

    <div class="container">
        <h2>Удаление лишнего (Ретушь)</h2>
        
        <div class="controls">
            <div class="file-upload-wrapper">
                <label class="file-upload-button-area">
                    <input type="file" id="eraserInput" accept="image/*">
                    <span class="file-upload-btn">Выберите файл</span>
                </label>
                <span class="file-name-display" id="eraserName">Файл не выбран</span>
            </div>
            
            <select id="eraserMode">
                <option value="transparent">Сделать прозрачным</option>
                <option value="white">Закрасить белым</option>
                <option value="custom">Закрасить цветом (Пипетка/Палитра)</option>
            </select>

            <label class="brush-size-label">
                Кисть: <input type="range" id="brushSize" min="5" max="100" value="20">
            </label>
        </div>

        <!-- Палитра и пипетка -->
        <div id="colorTools">
            <button id="pickerBtn" class="picker-btn">
                <img src="images/iconPipetka.png" alt="Пипетка" class="picker-icon">
                Пипетка
            </button>
            
            <div id="customColorWrapper">
                <input type="color" id="colorPicker" value="#ff0000">
            </div>
        </div>

        <div class="canvas-wrapper">
            <div id="canvasContainer">
                <div id="checkerboard"></div>
                <canvas id="eraserCanvas"></canvas>
                <div id="brushCursor"></div>
            </div>
        </div>

        <div class="result-area">
            <button id="saveEraserBtn" disabled>Скачать результат (PNG)</button>
            <div id="eraserStatus" class="status"></div>
        </div>
    </div>

    <script type="module" src="js/eraser.js"></script>
</body>
</html>
